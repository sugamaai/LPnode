                        <div class="outline-box" id="campaign__list">

                            <script>
                                function normalizeText(text) {
                                    return String(text || "")
                                        .toLowerCase()
                                        .replace(/\s+/g, " ")
                                        .trim();
                                }

                                function initAccordionSearchAndBrandFilter(scope) {
                                    const root = scope || document;
                                    const accordions = root.querySelectorAll("details.accordion");

                                    accordions.forEach(detail => {
                                        const input = detail.querySelector("input.accordion-search");
                                        const radios = detail.querySelectorAll(".brand-radio");
                                        const lis = detail.querySelectorAll("ul li");
                                        const empty = detail.querySelector(".accordion-search-empty");

                                        function runFilter() {
                                            const q = normalizeText(input?.value);

                                            const checked = detail.querySelector(".brand-radio:checked");
                                            const selectedBrand = normalizeText(checked?.value);

                                            let visible = 0;

                                            lis.forEach(li => {
                                                const name = normalizeText(li.dataset.name);
                                                const brand = normalizeText(li.dataset.brand);

                                                const nameHit =
                                                    !q || name.includes(q);

                                                const brandHit =
                                                    !selectedBrand ||
                                                    brand === selectedBrand;

                                                const hit = nameHit && brandHit;

                                                li.style.display = hit ? "" : "none";

                                                if (hit) visible++;
                                            });

                                            if (empty) {
                                                empty.style.display =
                                                    visible === 0 ? "block" : "none";
                                            }
                                        }

                                        if (input) {
                                            input.addEventListener("input", runFilter);
                                        }

                                        radios.forEach(radio => {
                                            radio.addEventListener("change", runFilter);
                                        });

                                        runFilter();
                                    });
                                }

                                function initRandomStore(scope) {
                                    const root = scope || document;
                                    const randomBtn = root.querySelector("#randomStoreBtn");

                                    if (!randomBtn) return;

                                    const links = Array.from(
                                        root.querySelectorAll(".campaign__list__wrap li a[href]")
                                    );

                                    if (links.length === 0) return;

                                    const randomIndex = Math.floor(Math.random() * links.length);
                                    const randomLink = links[randomIndex];

                                    console.log("ランダム店舗:", randomLink.href);

                                    randomBtn.addEventListener("click", function () {
                                        window.open(randomLink.href, "_blank", "noopener,noreferrer");
                                    });
                                }

                                fetch("./itemList.html")
                                    .then(r => r.text())
                                    .then(html => {
                                        const holder = document.getElementById("store-list");

                                        holder.innerHTML = html;

                                        initAccordionSearchAndBrandFilter(holder);
                                        initRandomStore(holder);
                                    });
                            </script>
