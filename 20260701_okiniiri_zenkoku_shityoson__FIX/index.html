    <script>
        const CSV_PATH = "./shops.csv";
        let STORE_DATA = [];

        const PREF_ORDER = [
            "北海道",
            "青森県", "岩手県", "宮城県", "秋田県", "山形県", "福島県",
            "茨城県", "栃木県", "群馬県", "埼玉県", "千葉県", "東京都", "神奈川県",
            "新潟県", "富山県", "石川県", "福井県", "山梨県", "長野県",
            "岐阜県", "静岡県", "愛知県", "三重県",
            "滋賀県", "京都府", "大阪府", "兵庫県", "奈良県", "和歌山県",
            "鳥取県", "島根県", "岡山県", "広島県", "山口県",
            "徳島県", "香川県", "愛媛県", "高知県",
            "福岡県", "佐賀県", "長崎県", "熊本県", "大分県", "宮崎県", "鹿児島県",
            "沖縄県"
        ];

        function parseCsvLine(line) {
            const cols = [];
            let cur = "";
            let inQuotes = false;

            for (let i = 0; i < line.length; i++) {
                const ch = line[i];

                if (ch === '"') {
                    if (inQuotes && line[i + 1] === '"') {
                        cur += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (ch === "," && !inQuotes) {
                    cols.push(cur.trim());
                    cur = "";
                } else {
                    cur += ch;
                }
            }

            cols.push(cur.trim());
            return cols;
        }

        function escapeHtml(value) {
            return String(value ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#39;");
        }

        function shouldShowImage(startDate, endDate) {
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            if (startDate) {
                const start = new Date(startDate);
                start.setHours(0, 0, 0, 0);
                if (!Number.isNaN(start.getTime()) && today < start) return false;
            }

            if (endDate) {
                const end = new Date(endDate);
                end.setHours(0, 0, 0, 0);
                if (!Number.isNaN(end.getTime()) && today >= end) return false;
            }

            return true;
        }

        function calcDistance(lat1, lng1, lat2, lng2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLng = (lng2 - lng1) * Math.PI / 180;

            const a =
                Math.sin(dLat / 2) ** 2 +
                Math.cos(lat1 * Math.PI / 180) *
                Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLng / 2) ** 2;

            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        async function loadStores() {
            const res = await fetch(CSV_PATH);

            if (!res.ok) {
                throw new Error("CSVを読み込めませんでした");
            }

            const csv = await res.text();
            const lines = csv.split(/\r?\n/).filter(Boolean);

            STORE_DATA = lines.slice(1).map(line => {
                const cols = parseCsvLine(line);

                return {
                    code: cols[0],
                    pref: cols[1],
                    name: cols[2],
                    url: cols[3],
                    image: cols[4],
                    brand: cols[5],
                    startDate: cols[6],
                    endDate: cols[7],
                    city: cols[8],
                    address: cols[9],
                    lat: Number(cols[10]),
                    lng: Number(cols[11]),
                };
            }).filter(store =>
                store.pref &&
                store.city &&
                store.name &&
                store.url
            );
        }

        function renderStoreCard(store, showDistance = false) {
            return `
                <li>
                    <a href="${escapeHtml(store.url)}" target="_blank" rel="noopener noreferrer">
                        <div class="store-wrap">
                            <div>
                                <div class=nearstore-name>
                                <p>${escapeHtml(store.name)}</p>
                                ${showDistance && store.distance !== undefined
                    ? `<p class="store-distance">約${store.distance.toFixed(1)}km</p>`
                    : ""
                }
                    </div>
                                ${store.image && shouldShowImage(store.startDate, store.endDate)
                    ? `<img src="./img/${escapeHtml(store.image)}" alt="${escapeHtml(store.name)}">`
                    : ""
                }
                            </div>
                            <button type="button">登録する</button>
                        </div>
                    </a>
                </li>
            `;
        }

        function renderStores(pref, city) {
            const list = document.getElementById("selectedStoreList");

            const stores = STORE_DATA.filter(store =>
                store.pref === pref &&
                store.city === city
            );

            if (stores.length === 0) {
                list.innerHTML = '<p class="select-guide">該当する店舗がありません。</p>';
                return;
            }

            list.innerHTML = `
                <ul class="fs_small">
                    ${stores.map(store => renderStoreCard(store)).join("")}
                </ul>
            `;
        }

        function renderNearbyStores(stores) {
            const area = document.getElementById("nearby-store-list");

            area.innerHTML = `
        <h3 class="nearby-title">現在地から近い店舗</h3>
        <div class="nearby-swiper">
            ${stores.map(store => `
                <div class="nearby-slide">
                    ${renderStoreCard(store, true)}
                </div>
            `).join("")}
        </div>
    `;
        }

        function initPrefSelect() {
            const prefSelect = document.getElementById("prefSelect");

            const prefs = [...new Set(STORE_DATA.map(store => store.pref))]
                .sort((a, b) => {
                    const indexA = PREF_ORDER.indexOf(a);
                    const indexB = PREF_ORDER.indexOf(b);

                    if (indexA === -1 && indexB === -1) return a.localeCompare(b, "ja");
                    if (indexA === -1) return 1;
                    if (indexB === -1) return -1;

                    return indexA - indexB;
                });

            prefs.forEach(pref => {
                const option = document.createElement("option");
                option.value = pref;
                option.textContent = pref;
                prefSelect.appendChild(option);
            });
        }

        function updateCitySelect(pref) {
            const citySelect = document.getElementById("citySelect");
            const list = document.getElementById("selectedStoreList");

            citySelect.innerHTML = "";

            if (!pref) {
                citySelect.disabled = true;
                citySelect.innerHTML = '<option value="">先に都道府県を選択してください</option>';
                list.innerHTML = '<p class="select-guide">都道府県と市町村を選択すると、<br>店舗が表示されます。</p>';
                return;
            }

            const cities = [...new Set(
                STORE_DATA
                    .filter(store => store.pref === pref)
                    .map(store => store.city)
                    .filter(Boolean)
            )].sort((a, b) => a.localeCompare(b, "ja"));

            citySelect.disabled = false;
            citySelect.innerHTML = '<option value="">市町村を選択してください</option>';

            cities.forEach(city => {
                const option = document.createElement("option");
                option.value = city;
                option.textContent = city;
                citySelect.appendChild(option);
            });

            list.innerHTML = '<p class="select-guide">市町村を選択してください。</p>';
        }

        function initNearbySearch() {
            const nearbyBtn = document.getElementById("nearbyStoreBtn");
            const area = document.getElementById("nearby-store-list");

            if (!nearbyBtn || !area) return;

            nearbyBtn.addEventListener("click", () => {
                area.innerHTML = '<p class="nearby-loading">現在地を取得しています...</p>';

                navigator.geolocation.getCurrentPosition(
                    position => {
                        const userLat = position.coords.latitude;
                        const userLng = position.coords.longitude;

                        const nearestStores = STORE_DATA
                            .filter(store =>
                                !Number.isNaN(store.lat) &&
                                !Number.isNaN(store.lng)
                            )
                            .map(store => ({
                                ...store,
                                distance: calcDistance(userLat, userLng, store.lat, store.lng),
                            }))
                            .sort((a, b) => a.distance - b.distance)
                            .slice(0, 10);

                        renderNearbyStores(nearestStores);
                    },
                    error => {
                        console.error(error);

                        area.innerHTML = `
                            <p class="nearby-error">
                                位置情報を取得できませんでした。<br>
                                ブラウザの位置情報設定をご確認ください。
                            </p>
                        `;
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 0,
                    }
                );
            });
        }

        function initRandomStore() {
            const randomBtn = document.getElementById("randomStoreBtn");

            if (!randomBtn || STORE_DATA.length === 0) return;

            const randomIndex = Math.floor(Math.random() * STORE_DATA.length);
            const randomStore = STORE_DATA[randomIndex];

            console.log("ランダム店舗:", randomStore.name, randomStore.url);

            randomBtn.addEventListener("click", function () {
                window.open(randomStore.url, "_blank", "noopener,noreferrer");
            });
        }

        async function initStoreSearch() {
            const loading = document.getElementById("loadingStoreData");
            const prefSelect = document.getElementById("prefSelect");
            const citySelect = document.getElementById("citySelect");
            const list = document.getElementById("selectedStoreList");

            try {
                await loadStores();

                if (loading) loading.remove();

                initPrefSelect();
                initNearbySearch();

                prefSelect.addEventListener("change", () => {
                    updateCitySelect(prefSelect.value);
                });
                await loadStores();

                if (loading) {
                    loading.remove();
                }

                initPrefSelect();
                initRandomStore();

                citySelect.addEventListener("change", () => {
                    if (!prefSelect.value || !citySelect.value) return;
                    renderStores(prefSelect.value, citySelect.value);
                });

            } catch (error) {
                console.error(error);

                if (loading) loading.remove();

                list.innerHTML = '<p class="select-guide">店舗データを読み込めませんでした。</p>';
            }
        }

        initStoreSearch();
    </script>
