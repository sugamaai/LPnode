    <script>
        const CSV_PATH = "./shops.csv";
        let STORE_DATA = [];

        function parseCsvLine(line) {
            const cols = [];
            let cur = "";
            let inQuotes = false;

            for (let i = 0; i < line.length; i++) {
                const ch = line[i];

                if (ch === '"') {
                    if (inQuotes && line[i + 1] === '"') {
                        cur += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (ch === "," && !inQuotes) {
                    cols.push(cur.trim());
                    cur = "";
                } else {
                    cur += ch;
                }
            }

            cols.push(cur.trim());
            return cols;
        }

        function escapeHtml(value) {
            return String(value ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#39;");
        }

        function shouldShowImage(startDate, endDate) {
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            if (startDate) {
                const start = new Date(startDate);
                start.setHours(0, 0, 0, 0);
                if (!Number.isNaN(start.getTime()) && today < start) return false;
            }

            if (endDate) {
                const end = new Date(endDate);
                end.setHours(0, 0, 0, 0);
                if (!Number.isNaN(end.getTime()) && today >= end) return false;
            }

            return true;
        }

        function calcDistance(lat1, lng1, lat2, lng2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLng = (lng2 - lng1) * Math.PI / 180;

            const a =
                Math.sin(dLat / 2) ** 2 +
                Math.cos(lat1 * Math.PI / 180) *
                Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLng / 2) ** 2;

            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        async function loadStores() {
            const res = await fetch(CSV_PATH);

            if (!res.ok) {
                throw new Error("CSVを読み込めませんでした");
            }

            const csv = await res.text();
            const lines = csv.split(/\r?\n/).filter(Boolean);

            STORE_DATA = lines.slice(1).map(line => {
                const cols = parseCsvLine(line);

                return {
                    code: cols[0],
                    pref: cols[1],
                    name: cols[2],
                    url: cols[3],
                    image: cols[4],
                    brand: cols[5],
                    startDate: cols[6],
                    endDate: cols[7],
                    city: cols[8],
                    address: cols[9],
                    lat: Number(cols[10]),
                    lng: Number(cols[11]),
                };
            }).filter(store =>
                store.name &&
                store.url &&
                !Number.isNaN(store.lat) &&
                !Number.isNaN(store.lng)
            );
        }

        function renderStoreCard(store) {
            return `
            <li>
                <a href="${escapeHtml(store.url)}" target="_blank" rel="noopener noreferrer">
                    <div class="store-wrap">
                        <div>
                            <div class="nearstore-name">
                                <p>${escapeHtml(store.name)}</p>
                                <p class="store-distance">約${store.distance.toFixed(1)}km</p>
                            </div>
    
                            ${store.image && shouldShowImage(store.startDate, store.endDate)
                    ? `<img src="./img/${escapeHtml(store.image)}" alt="${escapeHtml(store.name)}">`
                    : ""
                }
                        </div>
    
                        <button type="button">登録する</button>
                    </div>
                </a>
            </li>
        `;
        }

        function renderNearbyStores(stores) {
            const area = document.getElementById("nearby-store-list");

            area.innerHTML = `
        <h3 class="nearby-title">現在地から近い店舗</h3>
        <ul class="fs_small nearby-store-list">
            ${stores.map(store => renderStoreCard(store)).join("")}
        </ul>
    `;
        }

        async function initNearbySearch() {
            const btn = document.getElementById("nearbyStoreBtn");
            const area = document.getElementById("nearby-store-list");

            if (!btn || !area) return;

            try {
                await loadStores();
            } catch (error) {
                console.error(error);
                area.innerHTML = `<p class="nearby-error">店舗データを読み込めませんでした。</p>`;
                return;
            }

            btn.addEventListener("click", () => {
                area.innerHTML = `<p class="nearby-loading">現在地を取得しています...</p>`;

                navigator.geolocation.getCurrentPosition(
                    position => {
                        const userLat = position.coords.latitude;
                        const userLng = position.coords.longitude;

                        const nearestStores = STORE_DATA
                            .map(store => ({
                                ...store,
                                distance: calcDistance(userLat, userLng, store.lat, store.lng),
                            }))
                            .sort((a, b) => a.distance - b.distance)
                            .slice(0, 10);

                        renderNearbyStores(nearestStores);
                    },
                    error => {
                        console.error(error);
                        area.innerHTML = `
                        <p class="nearby-error">
                            位置情報を取得できませんでした。<br>
                            ブラウザの位置情報設定をご確認ください。
                        </p>
                    `;
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 0,
                    }
                );
            });
        }

        initNearbySearch();
    </script>
