<body>
    <!-- header.html の読み込み --------------------------->
    <header id="appHead"></header>
    <!-- --(/aeonapp/assets/js/...)-------------------- -->

    <h2>店舗検索</h2>

    <!-- 店舗名検索 -->
    <div class="search-area">
        <input type="text" id="searchInput" placeholder="店舗名で検索..." />
    </div>

    <!-- 都道府県セレクト -->
    <div class="filters">
        <label>
            都道府県：
            <select id="prefSelect">
                <!-- itemList.html 側で生成されている想定 -->
            </select>
        </label>
    </div>

    <!-- 件数表示（★ここ） -->
    <p id="resultCount" class="result-count"></p>

    <!-- 店名リスト -->
    <div id="itemListContainer"></div>


    <script>
        fetch('itemList.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('itemListContainer').innerHTML = html;

                const input = document.getElementById("searchInput");
                const prefSelect = document.getElementById("prefSelect");
                const resultCount = document.getElementById("resultCount");

                const ALL_VALUES = new Set(["", "すべて", "全て", "全件", "ALL", "all"]);

                // ★ itemList.html に埋め込んだ都道府県データ(prefData)からselectを作る
                const prefDataEl = document.getElementById("prefData");
                if (prefDataEl) {
                    const prefs = JSON.parse(prefDataEl.textContent || "[]");
                    prefSelect.innerHTML =
                        `<option value="">すべて</option>` +
                        prefs.map(p => `<option value="${p.replaceAll('&', '&amp;').replaceAll('"', '&quot;')}">${p}</option>`).join('');
                }

                function getItems() {
                    return Array.from(document.querySelectorAll("#itemList li"));
                }

                function applyFilters() {
                    const items = getItems();
                    const keyword = (input.value || "").trim().toLowerCase();

                    const rawPref = (prefSelect.value || "").trim();
                    const isAll = ALL_VALUES.has(rawPref);
                    const selectedPref = isAll ? "" : rawPref;

                    let visibleCount = 0;

                    items.forEach(li => {
                        const text = (li.textContent || "").toLowerCase();
                        const pref = (li.dataset.pref || "").trim();

                        const matchKeyword = !keyword || text.includes(keyword);
                        const matchPref = !selectedPref || pref === selectedPref;

                        const show = matchKeyword && matchPref;
                        li.hidden = !show;
                        if (show) visibleCount++;
                    });

                    resultCount.textContent = `${visibleCount}件表示`;
                }

                input.addEventListener("input", applyFilters);
                prefSelect.addEventListener("change", applyFilters);

                // 初期表示
                applyFilters();
            })
            .catch(err => {
                console.error(err);
                document.getElementById('itemListContainer').innerHTML = "<p>リストの読み込みに失敗しました。</p>";
            });
    </script>
